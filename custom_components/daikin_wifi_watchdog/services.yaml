reboot:
  name: Reboot WiFi module
  description: Soft-reboot a Daikin WiFi module discovered from the Daikin AC integration.
  fields:
    entry_id:
      name: Daikin config entry ID
      description: Optional. Config entry id of the official Daikin AC device.
      example: 01JABCDEF...
      selector:
        text:
    host:
      name: Host
      description: Optional. IP/hostname of the WiFi module.
      example: 192.168.1.50
      selector:
        text:

hard_reboot:
  name: Hard-reboot WiFi module
  description: Power-cycle the mapped smart plug for a Daikin WiFi module.
  fields:
    entry_id:
      name: Daikin config entry ID
      description: Optional. Config entry id of the official Daikin AC device.
      example: 01JABCDEF...
      selector:
        text:
    host:
      name: Host
      description: Optional. IP/hostname of the WiFi module.
      example: 192.168.1.50
      selector:
        text:

check_now:
  name: Check now
  description: Run a health check cycle immediately for all discovered Daikin modules.

apply_heat_mode:
  name: Apply heating mode
  description: Apply a heating scene (OFF / HORS-GEL / CONFORT / ECO / NUIT) to all Daikin units.
  fields:
    mode:
      name: Mode
      description: Optional. Heating mode to apply. Uses the current select value when omitted.
      example: confort
      selector:
        select:
          options:
            - off
            - hors_gel
            - confort
            - eco
            - nuit

apply_cool_mode:
  name: Apply cooling mode
  description: Apply a cooling scene (OFF / JOUR / NUIT / ECO / DRY) to all Daikin units.
  fields:
    mode:
      name: Mode
      description: Optional. Cooling mode to apply. Uses the current select value when omitted.
      example: jour
      selector:
        select:
          options:
            - off
            - jour
            - nuit
            - eco
            - dry

climate_evaluate:
  name: Evaluate climate AUTO
  description: Run AUTO chauffage / AUTO clim rules immediately (sensors, presence, openings).
