# Vue « Clim » à coller dans ton tableau de bord existant
# (remplace uniquement le bloc path: clim — laisse Home / Commandes / Jardin / …)
#
# Si les selects/switch du hub n’apparaissent pas : Paramètres → Entités
# → cherche « Daikin WiFi Watchdog » et corrige les entity_id.

title: Clim
path: clim
icon: mdi:home-thermometer-outline
type: sections
max_columns: 4
sections:
  # ── AUTO + scènes ─────────────────────────────────────────────────
  - type: grid
    cards:
      - type: heading
        heading: Gestion
        heading_style: title
        icon: mdi:thermostat-auto

      - type: tile
        entity: switch.daikin_wifi_watchdog_auto_heating
        name: AUTO chauffage
        icon: mdi:radiator
        features:
          - type: toggle

      - type: tile
        entity: switch.daikin_wifi_watchdog_auto_cooling
        name: AUTO clim
        icon: mdi:snowflake-thermometer
        features:
          - type: toggle

      - type: entities
        show_header_toggle: false
        entities:
          - entity: select.daikin_wifi_watchdog_heating_mode
            name: Mode chauffage
            icon: mdi:radiator
          - entity: select.daikin_wifi_watchdog_cooling_mode
            name: Mode clim
            icon: mdi:snowflake

  # ── Capteurs qui pilotent l’AUTO ──────────────────────────────────
  - type: grid
    cards:
      - type: heading
        heading: Capteurs
        heading_style: title
        icon: mdi:thermometer

      - type: tile
        entity: sensor.salon_temperature_interieure
        name: Salon
        icon: mdi:home-thermometer

      - type: tile
        entity: sensor.salon_temperature_exterieure
        name: Extérieur
        icon: mdi:sun-thermometer

      - type: tile
        entity: person.nico
        name: Présence
        icon: mdi:account-home

      - type: tile
        entity: sun.sun
        name: Jour / nuit
        icon: mdi:weather-sunset

  # ── Unités Daikin ─────────────────────────────────────────────────
  - type: grid
    cards:
      - type: heading
        heading: Pièces
        heading_style: title
        icon: mdi:hvac

      - type: tile
        entity: climate.salon
        name: Salon
        features:
          - type: climate-hvac-modes
            hvac_modes:
              - "off"
              - heat
              - cool
              - dry
              - fan_only
          - type: target-temperature

      - type: tile
        entity: climate.cuisine
        name: Cuisine
        features:
          - type: climate-hvac-modes
            hvac_modes:
              - "off"
              - heat
              - cool
              - dry
              - fan_only
          - type: target-temperature

      - type: tile
        entity: climate.bureau
        name: Bureau
        features:
          - type: climate-hvac-modes
            hvac_modes:
              - "off"
              - heat
              - cool
              - dry
              - fan_only
          - type: target-temperature

      - type: tile
        entity: climate.suite_parentale
        name: Suite parentale
        features:
          - type: climate-hvac-modes
            hvac_modes:
              - "off"
              - heat
              - cool
              - dry
              - fan_only
          - type: target-temperature

      - type: tile
        entity: climate.chambre_clara
        name: Chambre Clara
        features:
          - type: climate-hvac-modes
            hvac_modes:
              - "off"
              - heat
              - cool
              - dry
              - fan_only
          - type: target-temperature

      - type: tile
        entity: climate.chambre_louis
        name: Chambre Louis
        features:
          - type: climate-hvac-modes
            hvac_modes:
              - "off"
              - heat
              - cool
              - dry
              - fan_only
          - type: target-temperature

      - type: tile
        entity: climate.chambre_invites
        name: Chambre invités
        features:
          - type: climate-hvac-modes
            hvac_modes:
              - "off"
              - heat
              - cool
              - dry
              - fan_only
          - type: target-temperature
